[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "txv1-examples"
version = "0.1.0"
description = "Transaction v1 (SIMD-0385) examples in Python"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Solana Foundation" }]
# solders 0.29.0 is the first release with `MessageV1`, and the first to
# serialize versioned messages with wincode — the only encoding v1 supports.
dependencies = ["httpx>=0.27", "solders>=0.29,<1"]

[project.optional-dependencies]
dev = ["mypy>=1.14", "pytest>=8.3", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/txv1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live'"
markers = [
    "live: tests that need a running validator, gated behind `just test-live`",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP", "W"]

[tool.mypy]
strict = true
files = ["src", "examples", "tests"]
mypy_path = "src"
explicit_package_bases = true
